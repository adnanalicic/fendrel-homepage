<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fendrel – Demnächst verfügbar</title>
  <meta name="description" content="Fendrel – die Plattform für Branchenexperten. Wir sind bald für Sie da." />
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #1a2e4a;
      --navy-mid: #1e3a5f;
      --navy-dark: #0f1e30;
      --orange: #e87224;
      --orange-hover: #d4651f;
      --white: #ffffff;
      --gray-300: #cbd5e1;
      --gray-400: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, var(--navy-mid), var(--navy-dark) 70%);
      color: var(--white);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      overflow: hidden;
    }

    .wrap {
      position: relative;
      max-width: 560px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 40px;
    }
    .logo-mark {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--orange);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 22px;
      color: var(--white);
      box-shadow: 0 8px 24px rgba(232,114,36,.35);
    }
    .logo-text {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .badge {
      display: inline-block;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--orange);
      background: rgba(232,114,36,.12);
      border: 1px solid rgba(232,114,36,.3);
      padding: 6px 16px;
      border-radius: 999px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: clamp(32px, 6vw, 52px);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -1px;
      margin-bottom: 20px;
    }
    h1 .accent { color: var(--orange); }

    p {
      font-size: clamp(16px, 2.5vw, 18px);
      line-height: 1.6;
      color: var(--gray-300);
      margin: 0 auto 36px;
      max-width: 460px;
    }

    .contact {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 600;
      color: var(--white);
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 999px;
      background: var(--orange);
      transition: background .2s ease, transform .2s ease;
      box-shadow: 0 8px 24px rgba(232,114,36,.35);
    }
    .contact:hover {
      background: var(--orange-hover);
      transform: translateY(-1px);
    }

    footer {
      position: fixed;
      bottom: 24px;
      left: 0;
      right: 0;
      font-size: 13px;
      color: var(--gray-400);
    }
    footer a {
      color: var(--gray-400);
      text-decoration: none;
    }
    footer a:hover { color: var(--white); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <div class="logo-mark">F</div>
      <div class="logo-text">Fendrel</div>
    </div>

    <div class="badge">Demnächst verfügbar</div>

    <h1>Wir sind bald <span class="accent">für Sie da</span>.</h1>

    <p>
      Die Plattform für Branchenexperten befindet sich derzeit in den letzten
      Vorbereitungen. Schauen Sie bald wieder vorbei.
    </p>

    <a class="contact" href="mailto:info@fendrel.de">Kontakt aufnehmen</a>
  </div>

  <footer>
    &copy; <span id="year"></span> Fendrel &middot;
    <a href="datenschutz.html">Datenschutz</a>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
