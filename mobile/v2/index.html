    function WIcon({ kind, size = 20, color }) {
      const p = { width: size, height: size, viewBox: '0 0 24 24', fill: 'none', stroke: color, strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' };

        case 'sonnig':   return <svg {...p}><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5 5l1.4 1.4M17.6 17.6L19 19M19 5l-1.4 1.4M6.4 17.6L5 19"/></svg>;

    function App() {
      const [tasks, setTasks] = useState(SEED);
      const [screen, setScreen] = useState('list');   // list | detail | create
      const [selId, setSelId] = useState(null);
      const [toast, setToast] = useState(null);

      const [entry, setEntry] = useState('projects');     // projects | hub | app
      const [selProjectId, setSelProjectId] = useState(null);
      const [nav, setNav] = useState('aufgaben');         // aufgaben | fahrzeuge | bautagebuch | profil
      const [vehScreen, setVehScreen] = useState('fleet'); // fleet | vehicle
      const [selVehId, setSelVehId] = useState(null);
      const [diaryScreen, setDiaryScreen] = useState('list'); // list | entry | create
      const [selEntryId, setSelEntryId] = useState(null);

      const sel = tasks.find((t) => t.id === selId) || null;
      const selVeh = VEHICLES.find((v) => v.id === selVehId) || null;
      const selEntry = DIARY_ENTRIES.find((e) => e.id === selEntryId) || null;
      const project = PROJECTS.find((p) => p.id === selProjectId) || null;
      const flash = (msg) => { setToast(msg); clearTimeout(flash._t); flash._t = setTimeout(() => setToast(null), 2600); };

      const open = (t) => { setSelId(t.id); setScreen('detail'); };
      const goCreate = () => setScreen('create');
      const goList = () => setScreen('list');
      const openVeh = (v) => { setSelVehId(v.id); setVehScreen('vehicle'); };
      const goFleet = () => setVehScreen('fleet');
      const openEntry = (e) => { setSelEntryId(e.id); setDiaryScreen('entry'); };
      const goDiaryList = () => setDiaryScreen('list');
      const goHub = () => setEntry('hub');

      const pickProject = (p) => { setSelProjectId(p.id); setEntry('hub'); };
      const enterSection = (n) => {
        setNav(n);
        if (n === 'aufgaben') setScreen('list');
        if (n === 'fahrzeuge') setVehScreen('fleet');
        if (n === 'bautagebuch') setDiaryScreen('list');
        setEntry('app');
      };

      const goNav = (n) => {
        setNav(n);
        if (n === 'aufgaben') setScreen('list');
        if (n === 'fahrzeuge') setVehScreen('fleet');
        if (n === 'bautagebuch') setDiaryScreen('list');
      };

      const createTask = (data) => {
        const t = {
          id: uid(), title: data.title, priority: data.priority,
          due: data.dueLabel, when: data.when, ort: data.ort || '—',
          by: ME, done: false, description: data.description, labels: data.labels || [],
          photo: data.photo,
        };
        setTasks((list) => [t, ...list]);
        setScreen('list');
        flash('Aufgabe erstellt ✓');
      };
      const completeTask = (id) => {
        setTasks((list) => list.map((t) => t.id === id ? { ...t, done: true } : t));
      };

      let screenKey, body, caption;
      if (entry === 'projects') {
        screenKey = 'projects';
        body = <ProjectsScreen onOpen={pickProject}/>;
        caption = 'Projekt wählen';
      } else if (entry === 'hub') {
        screenKey = 'hub-' + (selProjectId || '');
        body = <ProjectHubScreen project={project} onBack={() => setEntry('projects')} onPick={enterSection}/>;
        caption = 'Projekt';
      } else if (nav === 'aufgaben') {
        screenKey = 'a-' + screen + (selId || '');
        body = screen === 'detail' && sel ? <DetailScreen t={sel} onBack={goList} onComplete={completeTask}/>
          : screen === 'create' ? <CreateScreen onBack={goList} onCreate={createTask}/>
          : <ListScreen tasks={tasks} project={project} onOpen={open} onCreate={goCreate} onNav={goNav} onHub={goHub}/>;
        caption = 'Aufgaben — Liste · Detail';
      } else if (nav === 'fahrzeuge') {
        screenKey = 'v-' + vehScreen + (selVehId || '');
        body = vehScreen === 'vehicle' && selVeh
          ? <VehicleScreen v={selVeh} onBack={goFleet} onToast={flash}/>
          : <FleetScreen project={project} onOpen={openVeh} onNav={goNav} onHub={goHub}/>;
        caption = 'Fahrzeuge — Wartungsbuch (Feldansicht)';
      } else if (nav === 'bautagebuch') {
        screenKey = 'b-' + diaryScreen + (selEntryId || '');
        body = diaryScreen === 'entry' && selEntry
          ? <DiaryEntryScreen e={selEntry} onBack={goDiaryList}/>
          : diaryScreen === 'create'

    /* ════════════════════════════════ LIST ════════════════════════════════ */
    function ListScreen({ tasks, project, onOpen, onCreate, onNav, onHub }) {
      const [tab, setTab] = useState('todo');

      const urgentToday = today.filter((t) => t.priority === 'urgent').length;
      const groups = [{ label: 'Heute', items: today }, { label: 'Diese Woche', items: week }].filter((g) => g.items.length);

      return (
        <div style={{ width: '100%', display: 'flex', flexDirection: 'column', minHeight: 0, flex: 1, background: FT.gray50, position: 'relative' }}>

          <div style={{ flexShrink: 0, background: SIGNAL, color: '#fff', padding: '8px 16px 14px' }}>
            <HubBack project={project} onHub={onHub}/>
            <div style={{ fontSize: 22, fontWeight: 800, letterSpacing: -0.3, marginTop: 4 }}>Meine Aufgaben</div>
          </div>

          {/* Tabs */}
          <div style={{ flexShrink: 0, background: '#fff', borderBottom: `1px solid ${FT.gray200}`, padding: '10px 14px', display: 'flex', gap: 8 }}>

            {tab === 'todo' ? (
              groups.map((g) => (
                <div key={g.label} style={{ marginTop: 14 }}>
                  <GroupHead label={g.label} count={g.items.length}/>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                    {g.items.map((it) => <TaskCard key={it.id} t={it} onClick={() => onOpen(it)}/>)}
                  </div>
                </div>

            ) : (
              <div style={{ marginTop: 14, display: 'flex', flexDirection: 'column', gap: 10 }}>
                {done.map((it) => <DoneCard key={it.id} t={it}/>)}
              </div>

              <Icon name="check-circle" size={15} color={FT.gray400}/>

                <div style={{ width: 46, height: 46, borderRadius: 12, flexShrink: 0, background: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>

                </div>
                <div style={{ minWidth: 0, flex: 1 }}>
                  <div style={{ fontSize: 12, fontWeight: 700, color: t.priority === 'urgent' ? FT.errorDark : FT.gray500, textTransform: 'uppercase', letterSpacing: 0.5 }}>Fällig</div>

              <div style={{ background: '#fff', borderRadius: 14, border: `1px solid ${FT.gray200}`, overflow: 'hidden' }}>

              <div style={{ display: 'flex', alignItems: 'center', gap: 9, padding: '4px 2px', color: FT.gray500 }}>
                <Icon name="check-circle" size={16} color={FT.success}/>

                <BigButton color={FT.success} icon="check" label="Erledigt melden" onClick={() => { onComplete(t.id); setPhase('fertig'); }}/>

              <BigButton color={FT.gray100} textColor={FT.gray500} icon="check" label="Erledigt ✓" onClick={onBack}/>

    /* ═══════════════════════════════ CREATE ═══════════════════════════════ */
    function CreateScreen({ onBack, onCreate }) {
      const [title, setTitle] = useState('');
      const [desc, setDesc] = useState('');
      const [prio, setPrio] = useState('medium');
      const [assignee, setAssignee] = useState(PEOPLE[0].name);
      const [ort, setOrt] = useState('');
      const [due, setDue] = useState('today');

      const DUE_OPTS = [
        { id: 'today', label: 'Heute', when: 'today' },
        { id: 'tomorrow', label: 'Morgen', when: 'week' },
        { id: 'week', label: 'Diese Woche', when: 'week' },
      ];
      const canSave = title.trim().length > 0;
      const submit = () => {
        if (!canSave) return;
        const d = DUE_OPTS.find((x) => x.id === due);
        onCreate({
          title: title.trim(), description: desc.trim(), priority: prio,
          ort: ort.trim(), dueLabel: d.label, when: d.when,
          labels: [], photo: false,
        });
      };

      return (
        <div style={{ width: '100%', display: 'flex', flexDirection: 'column', minHeight: 0, flex: 1, background: FT.gray50 }}>
          {/* App bar — signal theme */}
          <div style={{ flexShrink: 0, background: SIGNAL, color: '#fff', display: 'flex', alignItems: 'center', padding: '4px 6px 10px' }}>
            <button onClick={onBack} style={tapBtn(48)}><Icon name="x" size={24} color="#fff" strokeWidth={2.2}/></button>
            <div style={{ flex: 1, fontSize: 18, fontWeight: 600 }}>Neue Aufgabe</div>
          </div>

          <div style={{ flex: 1, minHeight: 0, overflow: 'auto', padding: '16px 16px 18px', display: 'flex', flexDirection: 'column', gap: 18 }}>
            {/* Title + voice */}
            <Field label="Was ist zu tun?" required>
              <div style={{ position: 'relative' }}>
                <textarea value={title} onChange={(e) => setTitle(e.target.value)} placeholder="z. B. Gerüst an Achse C prüfen"
                  rows={2} style={{ ...inputStyle, paddingRight: 56, resize: 'none', fontSize: 17, fontWeight: 600, lineHeight: 1.4 }}/>
                <button style={{
                  position: 'absolute', right: 8, top: 8, width: 40, height: 40, borderRadius: 11, border: 'none',
                  background: FT.orange50, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center',
                }} title="Per Sprache diktieren"><Icon name="mic" size={20} color={FT.orange} strokeWidth={2}/></button>
              </div>
              <Hint icon="mic">Tipp: Auf das Mikrofon tippen und einfach sprechen.</Hint>
            </Field>

            {/* Priority — big tappable */}
            <Field label="Wie wichtig?">
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
                {['urgent', 'high', 'medium', 'low'].map((k) => {
                  const p = PRIO[k]; const on = prio === k;
                  return (
                    <button key={k} onClick={() => setPrio(k)} style={{
                      appearance: 'none', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 10,
                      padding: '13px 13px', borderRadius: 12, background: on ? p.bg : '#fff',
                      border: `2px solid ${on ? p.stripe : FT.gray200}`, fontFamily: FT.font,
                    }}>
                      <span style={{ width: 12, height: 12, borderRadius: 999, background: p.stripe, flexShrink: 0 }}/>
                      <span style={{ fontSize: 15, fontWeight: 700, color: on ? p.fg : FT.gray700 }}>{p.label}</span>
                      {on ? <Icon name="check" size={17} color={p.fg} strokeWidth={3} style={{ marginLeft: 'auto' }}/> : null}
                    </button>
                  );
                })}
              </div>
            </Field>

            {/* Assignee */}
            <Field label="Wer macht es?">
              <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
                {PEOPLE.map((pp) => {
                  const on = assignee === pp.name;
                  return (
                    <button key={pp.name} onClick={() => setAssignee(pp.name)} style={{
                      appearance: 'none', cursor: 'pointer', display: 'inline-flex', alignItems: 'center', gap: 8,
                      padding: '7px 13px 7px 7px', borderRadius: 999, background: on ? FT.navy : '#fff',
                      border: `1.5px solid ${on ? FT.navy : FT.gray200}`, fontFamily: FT.font,
                    }}>
                      <Avatar name={pp.name} color={pp.color} size={26}/>
                      <span style={{ fontSize: 14.5, fontWeight: 700, color: on ? '#fff' : FT.navy }}>{pp.name.split(' ')[0]}</span>
                    </button>
                  );
                })}
              </div>
            </Field>

            {/* Where */}
            <Field label="Wo? (optional)">
              <div style={{ position: 'relative' }}>
                <span style={{ position: 'absolute', left: 13, top: '50%', transform: 'translateY(-50%)' }}><Icon name="pin" size={19} color={FT.gray400}/></span>
                <input value={ort} onChange={(e) => setOrt(e.target.value)} placeholder="z. B. Nordring · Achse C" style={{ ...inputStyle, paddingLeft: 42 }}/>
              </div>
            </Field>

            {/* Due */}
            <Field label="Bis wann?">
              <div style={{ display: 'flex', gap: 8 }}>
                {DUE_OPTS.map((d) => {
                  const on = due === d.id;
                  return (
                    <button key={d.id} onClick={() => setDue(d.id)} style={{
                      appearance: 'none', cursor: 'pointer', flex: 1, height: 48, borderRadius: 12,
                      background: on ? FT.orange50 : '#fff', border: `2px solid ${on ? FT.orange : FT.gray200}`,
                      fontFamily: FT.font, fontSize: 14.5, fontWeight: 700, color: on ? FT.orangeDark : FT.gray600,
                    }}>{d.label}</button>
                  );
                })}
              </div>
            </Field>

            {/* Description */}
            <Field label="Mehr Details (optional)">
              <textarea value={desc} onChange={(e) => setDesc(e.target.value)} rows={3} placeholder="Beschreibe genauer, was zu tun ist…" style={{ ...inputStyle, resize: 'none', lineHeight: 1.5 }}/>
            </Field>

            {/* Photo */}
            <Field label="Foto (optional)">
              <button style={{
                appearance: 'none', cursor: 'pointer', width: '100%', padding: '18px', borderRadius: 14,
                background: '#fff', border: `2px dashed ${FT.gray300}`, display: 'flex', flexDirection: 'column',
                alignItems: 'center', gap: 8, fontFamily: FT.font,
              }}>
                <div style={{ width: 46, height: 46, borderRadius: 12, background: FT.gray100, display: 'flex', alignItems: 'center', justifyContent: 'center' }}><Icon name="camera" size={24} color={FT.gray500} strokeWidth={2}/></div>
                <span style={{ fontSize: 14.5, fontWeight: 700, color: FT.gray600 }}>Foto aufnehmen oder auswählen</span>
              </button>
            </Field>
          </div>

          {/* Sticky save */}
          <div style={{ flexShrink: 0, background: '#fff', borderTop: `1px solid ${FT.gray200}`, padding: '12px 16px 14px', boxShadow: '0 -4px 16px rgba(15,43,70,0.06)' }}>
            <BigButton color={canSave ? FT.orange : FT.gray200} textColor={canSave ? '#fff' : FT.gray400} icon="check" label="Aufgabe erstellen" onClick={submit}/>
          </div>
        </div>
      );
    }

    /* ══════════════════════════════ FLEET (Fahrzeuge) ════════════════════ */
    function FleetScreen({ project, onOpen, onNav, onHub }) {
      const uvvCount = VEHICLES.filter((v) => v.status === 'uvv_faellig').length;
      const lockCount = VEHICLES.filter((v) => v.status === 'gesperrt').length;
      return (
        <div style={{ width: '100%', display: 'flex', flexDirection: 'column', minHeight: 0, flex: 1, background: FT.gray50 }}>
          {/* App bar */}
          <div style={{ flexShrink: 0, background: SIGNAL, color: '#fff', padding: '8px 16px 14px' }}>
            <HubBack project={project} onHub={onHub}/>
            <div style={{ fontSize: 22, fontWeight: 800, letterSpacing: -0.3, marginTop: 4 }}>Fahrzeuge</div>
            <div style={{ marginTop: 12, display: 'inline-flex', alignItems: 'center', gap: 9, padding: '8px 13px', borderRadius: 12, background: SIGNAL_CHIP }}>
              <Icon name="shield" size={17} color="#fff" strokeWidth={2.2}/>
              <span style={{ fontSize: 14, fontWeight: 600 }}>
                {VEHICLES.length} Fahrzeuge{uvvCount ? ` · ${uvvCount} UVV fällig` : ''}{lockCount ? ` · ${lockCount} gesperrt` : ''}
              </span>
            </div>
          </div>

          <div style={{ flex: 1, minHeight: 0, overflow: 'auto', padding: '14px 14px 18px', display: 'flex', flexDirection: 'column', gap: 11 }}>
            {VEHICLES.map((v) => <VehicleCard key={v.id} v={v} onClick={() => onOpen(v)}/>)}
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, padding: '10px 0 2px', color: FT.gray400 }}>
              <Icon name="info" size={14} color={FT.gray400}/>
              <span style={{ fontSize: 12, fontWeight: 600 }}>Tippe ein Fahrzeug für das Wartungsbuch.</span>
            </div>
          </div>
        </div>
      );
    }

    function VehicleCard({ v, onClick }) {
      const st = VSTATUS[v.status];
      const uvvTone = v.uvvIn == null ? null : v.uvvIn <= 7 ? 'error' : v.uvvIn <= 14 ? 'warn' : null;
      const uvvBg = uvvTone === 'error' ? FT.errorLight : uvvTone === 'warn' ? FT.warningLight : FT.gray100;
      const uvvFg = uvvTone === 'error' ? FT.errorDark : uvvTone === 'warn' ? FT.warningDark : FT.gray600;
      const uvvIc = uvvTone === 'error' ? FT.error : uvvTone === 'warn' ? FT.warning : FT.gray500;
      return (
        <button onClick={onClick} style={{
          appearance: 'none', cursor: 'pointer', textAlign: 'left', width: '100%',
          background: '#fff', borderRadius: 16, border: `1px solid ${FT.gray200}`,
          padding: '15px 16px', fontFamily: FT.font, boxShadow: '0 1px 2px rgba(15,43,70,0.04)',
          display: 'flex', flexDirection: 'column', gap: 10,
        }}>
          {/* Status + UVV */}
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <span style={{ width: 9, height: 9, borderRadius: 999, background: st.dot, flexShrink: 0 }}/>
            <span style={{ fontSize: 12, fontWeight: 800, color: st.fg, letterSpacing: 0.3, textTransform: 'uppercase', whiteSpace: 'nowrap' }}>{st.label}</span>
            <span style={{ marginLeft: 'auto', flexShrink: 0, whiteSpace: 'nowrap', display: 'inline-flex', alignItems: 'center', gap: 5, padding: '5px 10px', borderRadius: 9,
              background: uvvBg, color: uvvFg, fontSize: 12.5, fontWeight: 700 }}>
              <Icon name="shield" size={13} color={uvvIc} strokeWidth={2.2}/>UVV {v.uvvIn != null ? `${v.uvvIn} T` : '—'}
            </span>
          </div>
          {/* Title */}
          <div style={{ fontSize: 16.5, fontWeight: 700, color: FT.navy, lineHeight: 1.32 }}>
            <span style={{ fontFamily: FT.mono }}>{v.geraetenr}</span> · {v.hersteller} {v.modell}
          </div>
          {/* Meta */}
          <div style={{ display: 'flex', alignItems: 'center', flexWrap: 'wrap', gap: '4px 14px', fontSize: 13.5, color: FT.gray500, fontWeight: 600 }}>
            <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5 }}><Icon name="pin" size={14} color={FT.gray400}/>{v.halle}</span>
            <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5 }}><Icon name="gauge" size={14} color={FT.gray400}/>{v.betriebsstunden.toLocaleString('de-CH')} h</span>
            {v.offeneMaengel > 0 ? (
              <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5, color: FT.errorDark }}>
                <Icon name="warning" size={14} color={FT.error}/>{v.offeneMaengel} {v.offeneMaengel === 1 ? 'Mangel' : 'Mängel'}
              </span>
            ) : null}
          </div>
        </button>
      );
    }

    function StatCell({ icon, value, label, tone, mono = true }) {
      const c = tone === 'error' ? FT.errorDark : tone === 'warn' ? FT.warningDark : FT.gray600;
      const bg = tone === 'error' ? FT.errorLight : tone === 'warn' ? FT.warningLight : FT.gray50;
      return (
        <div style={{ background: bg, borderRadius: 10, padding: '8px 9px', display: 'flex', flexDirection: 'column', gap: 2, minWidth: 0 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
            <Icon name={icon} size={13} color={c}/>
            <span style={{ fontSize: 10.5, fontWeight: 700, color: c, textTransform: 'uppercase', letterSpacing: 0.3 }}>{label}</span>
          </div>
          <span style={{ fontFamily: mono ? FT.mono : FT.font, fontSize: mono ? 15 : 13.5, fontWeight: 700, color: tone ? c : FT.navy, lineHeight: 1.25, whiteSpace: mono ? 'nowrap' : 'normal', overflow: 'hidden', textOverflow: 'ellipsis' }}>{value}</span>
        </div>
      );
    }

    function StatusPill({ status, big }) {
      const st = VSTATUS[status];
      return (
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6, padding: big ? '5px 11px' : '3px 9px', borderRadius: 999, background: st.bg, color: st.fg, fontSize: big ? 13 : 11.5, fontWeight: 800 }}>
          <span style={{ width: big ? 8 : 6, height: big ? 8 : 6, borderRadius: 999, background: st.dot }}/>{st.label}
        </span>
      );
    }

    /* ══════════════════════════ VEHICLE (Wartungsbuch) ═══════════════════ */
    function VehicleScreen({ v, onBack, onToast }) {
      const [section, setSection] = useState('betrieb');
      const [adding, setAdding] = useState(false);
      const st = VSTATUS[v.status];
      const sec = VSECTIONS.find((s) => s.id === section);
      const rows = v.log[section] || [];

      React.useEffect(() => { setAdding(false); }, [section]);

      const blocked = v.status === 'gesperrt';
      const critMangel = (v.log.maengel || []).find((m) => m.schwere === 'K' && !m.behoben);

      return (
        <div style={{ width: '100%', display: 'flex', flexDirection: 'column', minHeight: 0, flex: 1, background: FT.gray50 }}>
          {/* App bar */}
          <div style={{ flexShrink: 0, background: SIGNAL, color: '#fff', padding: '4px 6px 12px' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
              <button onClick={onBack} style={tapBtn(48)}><Icon name="arrow-left" size={24} color="#fff" strokeWidth={2.2}/></button>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 17, fontWeight: 700, lineHeight: 1.15 }}>{v.geraetenr} · {v.modell}</div>
                <div style={{ fontSize: 12, color: 'rgba(255,255,255,0.8)' }}>Wartungsbuch · {v.hersteller}</div>
              </div>
            </div>
          </div>

          <div style={{ flex: 1, minHeight: 0, overflow: 'auto' }}>
            {/* Status banner — plausibility style */}
            {blocked ? (
              <Banner tone={SEV.K} title="Fahrzeug gesperrt" sub={critMangel ? critMangel.desc : 'Kritischer Mangel — Betrieb untersagt.'} icon="lock"/>
            ) : v.status === 'uvv_faellig' ? (
              <Banner tone={SEV.G} title="UVV-Prüfung fällig" sub={`In ${v.uvvIn} Tagen · ${v.uvvDate}`} icon="shield"/>
            ) : (
              <Banner tone={{ color: FT.success, light: FT.successLight, dark: FT.successDark }} title="Betriebsbereit" sub={`Nächste UVV: ${v.uvvDate} · in ${v.uvvIn} Tagen`} icon="check-circle"/>
            )}

            <div style={{ padding: '14px 16px 16px', display: 'flex', flexDirection: 'column', gap: 14 }}>
              {/* Key figures */}
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 9 }}>
                <BigStat icon="gauge" value={v.betriebsstunden.toLocaleString('de-CH')} label="Betriebsstd." />
                <BigStat icon="shield" value={v.uvvIn != null ? `${v.uvvIn} T` : '—'} label="bis UVV" tone={v.uvvIn <= 7 ? 'error' : v.uvvIn <= 14 ? 'warn' : 'ok'}/>
                <BigStat icon="warning" value={String(v.offeneMaengel)} label="off. Mängel" tone={v.offeneMaengel ? 'error' : 'ok'}/>
              </div>

              {/* Stammdaten quick facts */}
              <div style={{ background: '#fff', borderRadius: 14, border: `1px solid ${FT.gray200}`, overflow: 'hidden' }}>
                <FactRow icon="pin" label="Standort" value={v.halle}/>
                <div style={{ height: 1, background: FT.gray100 }}/>
                <FactRow icon="user" label="Verantwortlich" value={v.verantwortlich}/>
              </div>

              {/* Section chips */}
              <div>
                <SectionTitle icon="note">Wartungsbuch</SectionTitle>
                <div style={{ display: 'flex', gap: 7, marginTop: 10, overflowX: 'auto', paddingBottom: 2 }}>
                  {VSECTIONS.map((s) => {
                    const on = s.id === section;
                    const n = (v.log[s.id] || []).length;
                    return (
                      <button key={s.id} onClick={() => setSection(s.id)} style={{
                        appearance: 'none', cursor: 'pointer', flexShrink: 0, display: 'inline-flex', alignItems: 'center', gap: 7,
                        padding: '8px 13px', borderRadius: 999, fontFamily: FT.font, fontSize: 13.5, fontWeight: 700,
                        background: on ? FT.navy : '#fff', color: on ? '#fff' : FT.gray600, border: `1.5px solid ${on ? FT.navy : FT.gray200}`,
                      }}>
                        <Icon name={s.icon} size={15} color={on ? (s.id === 'maengel' ? '#fff' : FT.orange300) : FT.gray400} strokeWidth={2}/>
                        {s.label}
                        {n ? <span style={{ fontFamily: FT.mono, fontSize: 11, fontWeight: 700, color: on ? 'rgba(255,255,255,0.7)' : FT.gray400 }}>{n}</span> : null}
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* Add (inline) */}
              {adding ? (
                <VehicleAddForm sec={sec} v={v} onClose={() => setAdding(false)} onSave={() => { setAdding(false); onToast(sec.add.replace(/erfassen|dokumentieren|melden/, '').trim() + ' gespeichert ✓'); }}/>
              ) : (
                <button onClick={() => setAdding(true)} style={{
                  appearance: 'none', cursor: 'pointer', width: '100%', height: 50, borderRadius: 13, border: 'none',
                  background: section === 'maengel' ? FT.error : FT.orange, color: '#fff', fontFamily: FT.font, fontSize: 15.5, fontWeight: 800,
                  display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 9,
                  boxShadow: '0 2px 8px rgba(15,43,70,0.12)',
                }}>
                  <Icon name={section === 'maengel' ? 'warning' : 'plus'} size={20} color="#fff" strokeWidth={2.4}/>{sec.add}
                </button>
              )}

              {/* Recent entries */}
              <div>
                <div style={{ fontSize: 12, fontWeight: 800, color: FT.gray500, textTransform: 'uppercase', letterSpacing: 0.5, margin: '2px 2px 10px' }}>Letzte Einträge</div>
                {rows.length ? (
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 9 }}>
                    {rows.map((r, i) => <VehicleEntry key={i} section={section} r={r}/>)}
                  </div>
                ) : (
                  <div style={{ padding: '22px 12px', textAlign: 'center', fontSize: 13, color: FT.gray400, background: '#fff', borderRadius: 12, border: `1px dashed ${FT.gray300}` }}>Noch keine Einträge.</div>
                )}
              </div>

              <div style={{ display: 'flex', alignItems: 'center', gap: 9, padding: '2px 2px', color: FT.gray500 }}>
                <Icon name="check-circle" size={16} color={FT.success}/>
                <span style={{ fontSize: 13, fontWeight: 600 }}>Einträge sind UVV-konform & revisionssicher protokolliert.</span>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function Banner({ tone, title, sub, icon }) {
      return (
        <div style={{ display: 'flex', alignItems: 'flex-start', gap: 12, padding: '13px 16px', background: tone.light, borderLeft: `3px solid ${tone.color}` }}>
          <div style={{ width: 34, height: 34, borderRadius: 999, flexShrink: 0, background: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <Icon name={icon} size={19} color={tone.color} strokeWidth={2.2}/>
          </div>
          <div style={{ minWidth: 0 }}>
            <div style={{ fontSize: 15, fontWeight: 800, color: tone.dark }}>{title}</div>
            <div style={{ fontSize: 13, color: FT.gray700, marginTop: 1, lineHeight: 1.4 }}>{sub}</div>
          </div>
        </div>
      );
    }

    function BigStat({ icon, value, label, tone }) {
      const c = tone === 'error' ? FT.errorDark : tone === 'warn' ? FT.warningDark : FT.navy;
      const bg = tone === 'error' ? FT.errorLight : tone === 'warn' ? FT.warningLight : '#fff';
      const bd = tone === 'error' ? '#FCA5A5' : tone === 'warn' ? '#FCD34D' : FT.gray200;
      return (
        <div style={{ background: bg, borderRadius: 13, border: `1px solid ${bd}`, padding: '11px 11px', display: 'flex', flexDirection: 'column', gap: 5 }}>
          <Icon name={icon} size={17} color={c} strokeWidth={2}/>
          <span style={{ fontFamily: FT.mono, fontSize: 19, fontWeight: 800, color: c, lineHeight: 1 }}>{value}</span>
          <span style={{ fontSize: 11, fontWeight: 600, color: FT.gray500 }}>{label}</span>
        </div>
      );
    }

    function FactRow({ icon, label, value }) {
      return (
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '12px 15px' }}>
          <div style={{ width: 36, height: 36, borderRadius: 10, flexShrink: 0, background: FT.gray100, display: 'flex', alignItems: 'center', justifyContent: 'center' }}><Icon name={icon} size={18} color={FT.gray600} strokeWidth={2}/></div>
          <div style={{ minWidth: 0 }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: FT.gray500, textTransform: 'uppercase', letterSpacing: 0.4 }}>{label}</div>
            <div style={{ fontSize: 15, fontWeight: 700, color: FT.navy, marginTop: 1 }}>{value}</div>
          </div>
        </div>
      );
    }

    function VehicleEntry({ section, r }) {
      let title, sub, right;
      if (section === 'betrieb') { title = `${Number(r.stand).toLocaleString('de-CH')} h`; sub = `${r.diff} · ${r.by}${r.note ? ' · ' + r.note : ''}`; right = r.datum; }
      else if (section === 'wartung') { title = r.art; sub = `${r.pruefer} · ${r.ergebnis}`; right = r.datum; }
      else if (section === 'reparatur') { title = r.desc; sub = `${r.by} · ${r.kosten}`; right = r.datum; }
      else if (section === 'maengel') { title = r.desc; sub = r.behoben ? `behoben ${r.behoben}` : 'offen · ' + SEV[r.schwere].label; right = r.datum; }
      else if (section === 'einweisung') { title = r.name; sub = `${r.abt} · Schein ${r.schein}`; right = `gültig ${r.gueltig}`; }
      const sev = section === 'maengel' ? SEV[r.schwere] : null;
      const accent = sev ? sev.color : section === 'wartung' ? FT.success : section === 'reparatur' ? FT.info : FT.navy;
      return (
        <div style={{ background: '#fff', borderRadius: 12, border: `1px solid ${FT.gray200}`, borderLeft: `4px solid ${accent}`, padding: '12px 13px' }}>
          <div style={{ display: 'flex', alignItems: 'flex-start', gap: 10 }}>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 14.5, fontWeight: 700, color: FT.navy, lineHeight: 1.3 }}>{title}</div>
              <div style={{ fontSize: 12.5, color: FT.gray500, marginTop: 3 }}>{sub}</div>
            </div>
            <div style={{ textAlign: 'right', flexShrink: 0, display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 5 }}>
              <span style={{ fontSize: 11.5, color: FT.gray400, fontVariantNumeric: 'tabular-nums', whiteSpace: 'nowrap' }}>{right}</span>
              {sev ? <span style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center', width: 22, height: 22, borderRadius: 999, background: sev.color, color: '#fff', fontSize: 11, fontWeight: 800 }}>{sev.code}</span> : null}
              {section === 'wartung' ? <Icon name="check-circle" size={17} color={FT.success}/> : null}
            </div>
          </div>
        </div>
      );
    }

    // ── Inline schema-ish add form for a maintenance section ────────────────
    function VehicleAddForm({ sec, v, onClose, onSave }) {
      const isMangel = sec.id === 'betrieb';
      const [stand, setStand] = useState(sec.id === 'betrieb' ? String(v.betriebsstunden + 60) : '');
      const [text, setText] = useState('');

          {/* Sticky save */}
          <div style={{ flexShrink: 0, background: '#fff', borderTop: `1px solid ${FT.gray200}`, padding: '12px 16px 14px', boxShadow: '0 -4px 16px rgba(15,43,70,0.06)' }}>
            <BigButton color={canSave ? FT.success : FT.gray200} textColor={canSave ? '#fff' : FT.gray400} icon="lock" label="Eintrag rechtssicher speichern" onClick={() => { if (canSave) onSave(); }}/>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7, marginTop: 9, color: FT.gray400 }}>
              <Icon name="info" size={13} color={FT.gray400}/>
              <span style={{ fontSize: 11.5, fontWeight: 600 }}>Mit dem Speichern wird der Eintrag unveränderbar.</span>
            </div>
          </div>
        </div>
      );
    }

    /* ════════════════════════════════ PROFIL ═════════════════════════════ */
    function ProfilScreen({ project, onNav, onHub }) {
      return (
        <div style={{ width: '100%', display: 'flex', flexDirection: 'column', minHeight: 0, flex: 1, background: FT.gray50 }}>
          <div style={{ flexShrink: 0, background: SIGNAL, color: '#fff', padding: '8px 16px 18px' }}>
            <HubBack project={project} onHub={onHub}/>
            <div style={{ fontSize: 22, fontWeight: 800, letterSpacing: -0.3, marginTop: 4 }}>Profil</div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 13, marginTop: 14 }}>
              <Avatar name={ME.name} color={ME.color} size={52} ring="rgba(255,255,255,0.25)"/>
              <div>
                <div style={{ fontSize: 17, fontWeight: 800 }}>{ME.name}</div>
                <div style={{ fontSize: 13, color: 'rgba(255,255,255,0.75)' }}>Mitarbeiter · Recyclinghof Standort A</div>
              </div>
            </div>
          </div>
          <div style={{ flex: 1, minHeight: 0, overflow: 'auto', padding: '16px 16px' }}>
            <div style={{ background: '#fff', borderRadius: 14, border: `1px solid ${FT.gray200}`, overflow: 'hidden' }}>
              {[
                { icon: 'globe', label: 'Sprache', value: 'Deutsch' },
                { icon: 'note', label: 'Benachrichtigungen', value: 'An' },
                { icon: 'shield', label: 'Offline-Daten', value: 'Synchron' },
              ].map((r, i) => (
                <div key={r.label} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '14px 15px', borderTop: i === 0 ? 'none' : `1px solid ${FT.gray100}` }}>
                  <Icon name={r.icon} size={19} color={FT.gray500} strokeWidth={2}/>
                  <span style={{ fontSize: 15, fontWeight: 600, color: FT.navy, flex: 1 }}>{r.label}</span>
                  <span style={{ fontSize: 14, color: FT.gray500, fontWeight: 600 }}>{r.value}</span>
                  <Icon name="chevron" size={17} color={FT.gray300} strokeWidth={2.2}/>
                </div>
              ))}
            </div>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, padding: '20px 0', color: FT.gray400 }}>
              <Icon name="info" size={14} color={FT.gray400}/>
              <span style={{ fontSize: 12, fontWeight: 600 }}>Fendrel App · Version 2.4 (Feldansicht)</span>
            </div>
          </div>
        </div>
      );
    }

    /* ════════════════════════════ shared bits ════════════════════════════ */
    function Tab({ active, onClick, label, count }) {
      return (
        <button onClick={onClick} style={{ appearance: 'none', cursor: 'pointer', flex: 1, height: 44, borderRadius: 11, background: active ? FT.navy : FT.gray100, color: active ? '#fff' : FT.gray600, border: 'none', fontFamily: FT.font, fontSize: 14.5, fontWeight: 700, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 8 }}>
          {label}
          <span style={{ fontSize: 12, fontWeight: 800, minWidth: 22, height: 22, borderRadius: 999, padding: '0 6px', background: active ? 'rgba(255,255,255,0.18)' : FT.gray200, color: active ? '#fff' : FT.gray600, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', fontVariantNumeric: 'tabular-nums' }}>{count}</span>
        </button>
      );
    }
    function GroupHead({ label, count }) {
      return (
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 8, margin: '0 2px 10px' }}>
          <span style={{ fontSize: 13, fontWeight: 800, color: FT.gray500, textTransform: 'uppercase', letterSpacing: 0.7 }}>{label}</span>
          <span style={{ fontSize: 13, fontWeight: 700, color: FT.gray400 }}>· {count}</span>
        </div>
      );
    }
    function BottomNav({ active, onNav, hasDiary }) {
      return (
        <div style={{ flexShrink: 0, background: '#fff', borderTop: `1px solid ${FT.gray200}`, display: 'flex', padding: '6px 6px 8px', position: 'relative', zIndex: 10 }}>
          <BottomTab icon="checklist" label="Aufgaben" active={active === 'aufgaben'} onClick={() => onNav && onNav('aufgaben')}/>
          <BottomTab icon="wrench" label="Fahrzeuge" active={active === 'fahrzeuge'} onClick={() => onNav && onNav('fahrzeuge')}/>
          {hasDiary ? <BottomTab icon="book" label="Tagebuch" active={active === 'bautagebuch'} onClick={() => onNav && onNav('bautagebuch')}/> : null}
          <BottomTab icon="user" label="Profil" active={active === 'profil'} onClick={() => onNav && onNav('profil')}/>
        </div>
      );
    }
    function BottomTab({ icon, label, active, onClick }) {
      return (
        <button onClick={onClick} style={{ appearance: 'none', cursor: 'pointer', flex: 1, border: 'none', background: 'transparent', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3, padding: '6px 0', fontFamily: FT.font }}>
          <div style={{ width: 64, height: 32, borderRadius: 999, display: 'flex', alignItems: 'center', justifyContent: 'center', background: active ? FT.orange50 : 'transparent' }}><Icon name={icon} size={22} color={active ? FT.orange : FT.gray500} strokeWidth={2}/></div>
          <span style={{ fontSize: 12, fontWeight: active ? 800 : 600, color: active ? FT.orangeDark : FT.gray500 }}>{label}</span>
        </button>
      );
    }
    function BigButton({ color, outline, icon, label, onClick, textColor }) {
      return (
        <button onClick={onClick} style={{ appearance: 'none', cursor: 'pointer', width: '100%', height: 56, borderRadius: 14, background: outline ? '#fff' : color, color: outline ? FT.orange : (textColor || '#fff'), border: outline ? `2px solid ${FT.orange}` : 'none', fontFamily: FT.font, fontSize: 17, fontWeight: 800, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 10, boxShadow: outline ? 'none' : '0 2px 8px rgba(15,43,70,0.12)' }}>
          <Icon name={icon} size={22} color={outline ? FT.orange : (textColor || '#fff')} strokeWidth={2.4}/>{label}
        </button>
      );
    }
    function InfoRow({ icon, label, value, sub }) {
      return (
        <div style={{ display: 'flex', alignItems: 'center', gap: 14, padding: '13px 15px' }}>
          <div style={{ flexShrink: 0 }}>{icon}</div>
          <div style={{ minWidth: 0 }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: FT.gray500, textTransform: 'uppercase', letterSpacing: 0.4 }}>{label}</div>
            <div style={{ fontSize: 16, fontWeight: 700, color: FT.navy, marginTop: 1 }}>{value}</div>
            {sub ? <div style={{ fontSize: 13, color: FT.gray500, marginTop: 1 }}>{sub}</div> : null}
          </div>
        </div>
      );
    }
    function IconBox({ name }) {
      return <div style={{ width: 40, height: 40, borderRadius: 11, background: FT.gray100, display: 'flex', alignItems: 'center', justifyContent: 'center' }}><Icon name={name} size={21} color={FT.gray600} strokeWidth={2}/></div>;
    }
    function SectionTitle({ icon, children }) {
      return (
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 4 }}>
          <Icon name={icon} size={17} color={FT.gray500} strokeWidth={2}/>
          <span style={{ fontSize: 13, fontWeight: 800, color: FT.gray600, textTransform: 'uppercase', letterSpacing: 0.6, whiteSpace: 'nowrap' }}>{children}</span>
        </div>
      );
    }
    function PhotoTile({ label }) {
      return (
        <div style={{ position: 'relative', width: '100%', aspectRatio: '16 / 9', borderRadius: 14, overflow: 'hidden', background: 'linear-gradient(135deg, #6e7d8a, #2c3c4b)', border: `1px solid ${FT.gray200}` }}>
          <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center' }}><Icon name="image" size={40} color="rgba(255,255,255,0.55)" strokeWidth={1.6}/></div>
          <div style={{ position: 'absolute', left: 12, bottom: 12, display: 'inline-flex', alignItems: 'center', gap: 7, padding: '5px 11px', borderRadius: 999, background: 'rgba(0,0,0,0.45)', color: '#fff', fontSize: 12.5, fontWeight: 600 }}>
            <Icon name="camera" size={14} color="#fff"/>{label}
          </div>
        </div>
      );
    }
    function Field({ label, required, children }) {
      return (
        <div>
          <div style={{ fontSize: 14.5, fontWeight: 800, color: FT.navy, marginBottom: 9 }}>
            {label}{required ? <span style={{ color: FT.orange, marginLeft: 4 }}>*</span> : null}
          </div>
          {children}
        </div>
      );
    }
    function Hint({ icon, children }) {
      return (
        <div style={{ display: 'flex', alignItems: 'center', gap: 7, marginTop: 8, color: FT.gray500 }}>
          <Icon name={icon} size={14} color={FT.gray400}/>
          <span style={{ fontSize: 12.5, fontWeight: 600 }}>{children}</span>
        </div>
      );
    }

    const inputStyle = {
      width: '100%', border: `1.5px solid ${FT.gray300}`, borderRadius: 12, padding: '13px 14px',
      fontFamily: FT.font, fontSize: 15.5, color: FT.navy, outline: 'none', background: '#fff',
    };
    function tapBtn(size) {
      return { appearance: 'none', border: 'none', background: 'transparent', cursor: 'pointer', width: size, height: size, borderRadius: 12, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 };
    }
    const textBtn = { appearance: 'none', cursor: 'pointer', width: '100%', height: 48, marginTop: 8, background: 'transparent', border: 'none', color: FT.gray700, fontFamily: FT.font, fontSize: 15, fontWeight: 700, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 9 };

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
