<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<title>Mein Arbeitsplatz — Aufgaben (Prototyp)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"/>
<meta name="robots" content="noindex"/>
<meta name="theme-color" content="#FAFBFC"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   Mein Arbeitsplatz — mobile-first clickable mockup (single file SPA)
   Design source: Aufgaben.dc.html · navy/orange · Roboto
   Screens are rendered by JS into #app. No phone frame.
   ===================================================================== */
:root{
  --navy:#16304A; --navy-2:#14304B; --ink:#16304A;
  --muted:#7C8794; --muted-2:#9AA4AF; --slate:#3C4A5A;
  --orange:#EE7621; --orange-2:#F2772B; --orange-bd:#E8731F; --orange-bg:#FCEADB; --orange-tx:#C2541D;
  --line:#E4E7EB; --line-2:#EDEFF2;
  --page:#EAEEF3; --surface:#F6F7F9; --card:#fff;
  --chip:#E7ECF2; --chip-tx:#475569;
  --shadow:0 8px 30px rgba(0,0,0,.10);
  --maxw:440px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:'Roboto',system-ui,-apple-system,sans-serif;
  background:#cfd4da;color:var(--ink);
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
::placeholder{color:var(--muted-2);}
button,input,textarea{font-family:inherit;}
::-webkit-scrollbar{width:0;height:0;}

/* ---- App shell (the centred "device-less" column) ---- */
#app{
  position:relative;
  width:100%;max-width:var(--maxw);margin:0 auto;
  height:100dvh;height:100vh;
  background:var(--page);
  display:flex;flex-direction:column;
  overflow:hidden;
  box-shadow:0 0 60px rgba(15,43,70,.18);
}
@media(min-width:480px){ body{display:flex;align-items:center;justify-content:center;} #app{height:920px;max-height:96dvh;border-radius:28px;} }

.screen{flex:1;display:flex;flex-direction:column;min-height:0;animation:scrIn .22s ease;}
@keyframes scrIn{from{opacity:.4;transform:translateY(6px);}to{opacity:1;transform:none;}}
@media(prefers-reduced-motion:reduce){.screen{animation:none;}}

/* ---- Header ---- */
.hdr{flex-shrink:0;background:#FAFBFC;padding:calc(14px + env(safe-area-inset-top)) 16px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 0 rgba(15,43,70,.06);}
.hdr.white{background:#fff;border-bottom:1px solid var(--line-2);box-shadow:none;}
.hdr h1{flex:1;min-width:0;font-size:23px;font-weight:900;color:var(--ink);letter-spacing:-.5px;}
.hdr h1.sm{font-size:21px;}
.iconbtn{width:46px;height:46px;border-radius:13px;background:#EFF1F4;border:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;}
.iconbtn.plain{background:#F1F3F5;width:44px;height:44px;border-radius:12px;}
.iconbtn .badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--orange);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #FAFBFC;}
.iconbtn.rel{position:relative;}
.sync{display:flex;align-items:center;gap:6px;padding:5px 11px 5px 5px;border-radius:999px;background:#E7F6EC;border:1.5px solid #9FDBB4;flex-shrink:0;}
.sync .dot{width:26px;height:26px;border-radius:999px;background:#16A34A;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(22,163,74,.4);}
.sync span{font-size:12.5px;font-weight:700;color:#15803D;letter-spacing:.2px;}

/* ---- Scroll body ---- */
.body{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;}
.pad{padding:16px;display:flex;flex-direction:column;gap:16px;}
.section-label{font-size:13px;font-weight:800;color:#8A93A0;letter-spacing:.5px;margin:6px 4px -2px;}

/* ---- List card (orange highlight style from design) ---- */
.card{background:var(--orange-bg);border:2px solid var(--orange-bd);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:15px;cursor:pointer;text-align:left;width:100%;font-family:inherit;transition:transform .08s;}
.card:active{transform:scale(.985);}
.card .ic{width:56px;height:56px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.card .ttl{font-size:20px;font-weight:900;color:var(--ink);letter-spacing:-.3px;line-height:1.15;}
.card .sub{font-size:14px;color:var(--muted);margin-top:3px;}
.card .grow{flex:1;min-width:0;}
.card .cnt{font-size:25px;font-weight:700;color:var(--orange-bd);flex-shrink:0;}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* task list card variant (title + meta + status pill) */
.tcard{align-items:flex-end;}
.pill{font-size:12px;font-weight:800;letter-spacing:.3px;color:var(--chip-tx);background:var(--chip);padding:5px 10px;border-radius:8px;flex-shrink:0;}
.tcard .ttl{font-size:18px;}
.meta-row{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);}
.meta-row.dim{font-size:13px;color:var(--muted-2);margin-top:3px;}

/* ---- Filter chips row ---- */
.chips{padding:16px 16px 4px;display:flex;gap:10px;overflow-x:auto;}
.chip{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1.5px solid #DDE2E7;border-radius:999px;padding:11px 16px;flex-shrink:0;cursor:pointer;font-size:16px;font-weight:700;color:#5A6573;white-space:nowrap;}
.chip .n{font-size:13px;font-weight:800;color:var(--muted-2);background:#EEF1F5;border-radius:999px;min-width:22px;height:22px;display:flex;align-items:center;justify-content:center;padding:0 6px;}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff;}
.chip.on .n{color:var(--navy);background:#fff;}

/* ---- Bottom nav ---- */
.nav{flex-shrink:0;background:#FAFBFC;height:calc(70px + env(safe-area-inset-bottom));padding:12px 36px env(safe-area-inset-bottom);display:flex;align-items:flex-start;border-top:1px solid #E6EAEF;}
.nav.white{background:#fff;}
.nav .slot{flex:1;display:flex;justify-content:center;}
.nav button{background:none;border:none;cursor:pointer;padding:0;display:flex;}
.nav button.fab{width:70px;height:70px;border-radius:999px;background:var(--orange);display:flex;align-items:center;justify-content:center;margin-top:-28px;box-shadow:0 6px 16px rgba(238,118,33,.4);border:4px solid #FAFBFC;cursor:pointer;}
.nav.white .fab{border-color:#fff;}

/* ---- Detail screen ---- */
.detail-h1{font-size:27px;font-weight:900;color:var(--ink);letter-spacing:-.6px;line-height:1.15;}
.statuschip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;flex-shrink:0;}
.statuschip .d{width:7px;height:7px;border-radius:999px;}
.statuschip span{font-size:13px;font-weight:800;}
.info{background:#fff;border:1.5px solid var(--line-2);border-radius:14px;overflow:hidden;margin-top:22px;}
.info .row{display:flex;align-items:center;gap:12px;padding:15px 16px;}
.info .row .k{flex:1;font-size:16px;color:var(--muted);}
.info .row .v{font-size:16px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px;}
.info .sep{height:1px;background:var(--line-2);margin-left:16px;}
.h-label{font-size:18px;font-weight:900;color:var(--ink);letter-spacing:-.2px;margin:24px 2px 10px;}
.box{background:#fff;border:1.5px solid var(--line-2);border-radius:14px;padding:16px;font-size:16px;color:var(--slate);line-height:1.55;}
.label-pill{padding:8px 15px;border-radius:999px;border:1.5px solid #DDE2E7;background:#fff;font-size:14px;font-weight:600;color:var(--slate);}
.photos{display:flex;gap:10px;}
.photo{flex:1;height:88px;border-radius:12px;background:#E7EAEE;display:flex;align-items:center;justify-content:center;}
.avatar{border-radius:999px;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* ---- Footer CTA ---- */
.foot{flex-shrink:0;background:#fff;padding:12px 18px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line-2);}
.btn{width:100%;height:56px;border:none;border-radius:14px;background:var(--orange);color:#fff;font-size:18px;font-weight:700;letter-spacing:.2px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;}
.btn.ghost{background:#F1F3F5;color:var(--ink);}
.btn:active{filter:brightness(.96);}

/* ---- Form ---- */
.form{background:var(--surface);padding:18px;}
.bigchoice{cursor:pointer;width:100%;text-align:left;background:var(--orange-bg);border:1.5px solid var(--orange-bd);border-radius:16px;padding:16px 18px;display:flex;align-items:center;gap:15px;}
.bigchoice .ic{width:52px;height:52px;border-radius:999px;background:var(--orange-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.bigchoice .t{font-size:19px;font-weight:900;color:var(--ink);letter-spacing:-.3px;}
.bigchoice .s{font-size:15px;color:var(--orange-bd);margin-top:2px;}
.fld{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:16px;font-size:17px;color:var(--ink);outline:none;}
textarea.fld{font-size:16px;resize:none;height:104px;}
.req{color:var(--orange-bd);}
.selectrow{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:16px;display:flex;align-items:center;gap:11px;font-size:17px;color:var(--ink);cursor:pointer;}
.selectrow.ph{color:var(--muted-2);}
.tagwrap{display:flex;flex-wrap:wrap;gap:10px;}
.tag{cursor:pointer;padding:9px 16px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-size:15px;font-weight:600;color:var(--slate);display:inline-flex;align-items:center;gap:6px;font-family:inherit;}
.tag.on{padding-left:12px;background:var(--orange-bg);border-color:var(--orange-bd);color:var(--orange-tx);font-weight:700;}
.tag .ck{display:none;}
.tag.on .ck{display:block;}
.tag.avatar-tag{padding:6px 15px 6px 6px;}

/* ---- Comments preview card ---- */
.cpv{cursor:pointer;text-align:left;width:100%;background:#fff;border:1.5px solid var(--line-2);border-radius:14px;padding:2px 16px 14px;font-family:inherit;}
.cpv .c{display:flex;gap:11px;padding-top:14px;}
.cpv .who{font-size:14px;color:var(--muted);}
.cpv .who b{font-weight:800;color:var(--ink);}
.cpv .txt{font-size:15px;color:var(--slate);margin-top:2px;}
.cpv .inputrow{display:flex;align-items:center;gap:10px;padding-top:14px;margin-top:14px;border-top:1px solid var(--line-2);}
.cpv .ghostinput{flex:1;background:#F1F3F5;border-radius:999px;padding:10px 15px;font-size:14px;color:var(--muted-2);}

/* ---- Sheets / modals ---- */
.overlay{position:absolute;inset:0;background:rgba(20,30,45,.42);display:flex;flex-direction:column;justify-content:flex-end;z-index:40;animation:fade .2s ease;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
.sheet{background:#fff;border-radius:24px 24px 0 0;padding:12px 20px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.18);max-height:88%;overflow:auto;animation:up .26s cubic-bezier(.2,.8,.2,1);}
.sheet.full{height:78%;padding:0;display:flex;flex-direction:column;}
@keyframes up{from{transform:translateY(100%);}to{transform:none;}}
.grab{width:40px;height:5px;border-radius:999px;background:#D7DBE0;margin:2px auto 16px;}
.sheet h2{font-size:26px;font-weight:900;color:var(--ink);letter-spacing:-.5px;}
.sheet .grp{font-size:13px;font-weight:800;color:#8A93A0;letter-spacing:.5px;margin:18px 0 11px;}
.statusopt{cursor:pointer;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:13px 15px;display:flex;align-items:center;gap:14px;margin-bottom:10px;font-family:inherit;}
.statusopt.on{background:var(--orange-bg);border-color:var(--orange-bd);}
.statusopt .ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.statusopt .t{font-size:17px;font-weight:800;color:var(--ink);letter-spacing:-.2px;}
.statusopt .s{font-size:13px;color:var(--muted);margin-top:1px;}
.statusopt .rd{width:26px;height:26px;border-radius:999px;border:2px solid #CFD8E3;flex-shrink:0;}
.statusopt.on .rd{border:none;background:var(--orange-bd);display:flex;align-items:center;justify-content:center;}
.validrow{background:#FEF3C7;border:1.5px solid #FCD34D;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:14px;margin-bottom:12px;}
.validrow .ic{width:46px;height:46px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.validrow .ic .d{width:30px;height:30px;border-radius:999px;background:#F59E0B;display:flex;align-items:center;justify-content:center;}
.validrow span{font-size:19px;font-weight:900;color:var(--ink);letter-spacing:-.3px;}

/* chat */
.chat-h{flex-shrink:0;padding:12px 20px 14px;border-bottom:1px solid var(--line-2);}
.chat-h .top{display:flex;align-items:center;}
.chat-h h2{flex:1;font-size:22px;letter-spacing:-.4px;}
.chat-body{flex:1;min-height:0;overflow:auto;padding:18px 16px;display:flex;flex-direction:column;gap:16px;}
.msg{display:flex;gap:9px;align-items:flex-end;}
.msg.me{justify-content:flex-end;}
.msg .bub{max-width:76%;}
.msg .name{font-size:12px;font-weight:700;color:var(--muted);margin:0 0 3px 4px;}
.msg .b{background:#EFF1F4;border-radius:5px 16px 16px 16px;padding:10px 13px;font-size:15px;color:var(--ink);line-height:1.35;}
.msg.me .b{background:var(--orange);color:#fff;border-radius:16px 5px 16px 16px;}
.msg .time{font-size:11px;color:var(--muted-2);margin:3px 0 0 4px;}
.msg.me .time{text-align:right;margin:3px 4px 0 0;}
.chat-foot{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line-2);}
.chat-foot .gi{flex:1;background:#F1F3F5;border-radius:999px;padding:13px 16px;font-size:15px;color:var(--muted-2);}
.send{width:46px;height:46px;border-radius:999px;background:var(--orange);display:flex;align-items:center;justify-content:center;flex-shrink:0;border:none;cursor:pointer;}

/* toast */
.toast{position:absolute;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:var(--shadow);z-index:60;animation:tIn .2s ease;max-width:88%;text-align:center;}
@keyframes tIn{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translateX(-50%);}}
</style>
</head>
<body>
<div id="app"></div>

<script>

  const counts = {
    alle: TASKS.filter(t=>t.id!=='t0').length,

  return `<div class="screen">

function sheetStatus(){
  const cur = (findTask(cur().id)||TASKS.find(t=>t.id==='t0')).status;
  const opt=(key,ic,icbg,t,s)=>`<button class="statusopt ${cur===key?'on':''}" data-action="set-status" data-status="${key}">

    <div class="rd">${cur===key?I.check:''}</div></button>`;
  return overlay(`<div class="grab"></div>
    <h2 style="margin-bottom:18px;">Status ändern</h2>
    ${opt('in_bearbeitung',I.play,'#F2772B','In Bearbeitung','Du arbeitest aktiv daran')}
    ${opt('pausiert',I.pause,'#F59E0B','Pausiert','Vorübergehend angehalten')}
    ${opt('abgeschlossen',I.done,'#16A34A','Abgeschlossen','Aufgabe ist erledigt')}
    ${opt('offen',I.pool,'#64748B','Zurück in den Pool','Freigeben für andere')}

function sheetValidation(){
  const row=t=>`<div class="validrow"><div class="ic"><div class="d">${I.warn}</div></div><span>${t}</span></div>`;
  const missing=[];
  if(!state.newTask.title.trim()) missing.push('Titel');
  if(!state.newTask.desc.trim()) missing.push('Beschreibung');
  return overlay(`<div class="grab"></div>
    <h2>Noch nicht vollständig</h2>
    <div style="font-size:15px;color:var(--muted);margin:6px 0 18px;">Bitte ergänze noch:</div>
    ${missing.map(row).join('')}
    <button class="btn ghost" style="margin-top:4px;" data-action="close-sheet">Verstanden</button>`);
}

  const mine=(txt,time)=>`<div class="msg me"><div class="bub"><div class="b">${txt}</div><div class="time">${time}</div></div></div>`;
  return `<div class="overlay" data-overlay>
    <div class="sheet full">
      <div class="chat-h">
        <div class="grab"></div>
        <div class="top"><h2>Kommentare <span style="color:var(--muted-2);font-weight:800;">4</span></h2><button class="avatar" style="width:36px;height:36px;background:#F1F3F5;border:none;cursor:pointer;" data-action="close-sheet">${I.x}</button></div>
      </div>
      <div class="chat-body">
        ${incoming('Anna Schmidt','Container ist fast voll, bitte heute noch leeren.','09:12')}
        ${incoming('David Werner','Bin um 11 Uhr vor Ort.','09:34')}
        ${mine('Foto vom Füllstand wäre hilfreich.','09:40')}
        ${incoming('Anna Schmidt','Mache ich gleich.','09:42')}
      </div>
      <div class="chat-foot"><div class="gi">Kommentar schreiben…</div><button class="send" data-action="toast" data-msg="Senden (Demo)">${I.send}</button></div>
    </div>
  </div>`;
}

function overlay(inner){ return `<div class="overlay" data-overlay><div class="sheet">${inner}</div></div>`; }

/* =====================================================================
   RENDER
   ===================================================================== */
function renderScreen(){
  const t = cur();
  switch(t.view){
    case 'home': return screenHome();
    case 'project': return screenProject(t.id);
    case 'tasks': return screenTasks();
    case 'triages': return screenTriages();
    case 'task': return screenTask(t.id);
    case 'new': return screenNew();
    default: return screenHome();
  }
}
function renderSheet(){
  switch(state.sheet){
    case 'filter': return sheetFilter();
    case 'photo': return sheetPhoto();
    case 'status': return sheetStatus();
    case 'validation': return sheetValidation();
    case 'comments': return sheetComments();
    default: return '';
  }
}
let toastTimer=null;
function render(){
  const app=document.getElementById('app');
  app.innerHTML = renderScreen() + renderSheet() + (state._toast?`<div class="toast">${state._toast}</div>`:'');
}
function toast(msg){
  state._toast=msg; render();
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{ state._toast=null; render(); }, 1900);
}

/* =====================================================================
   EVENTS (delegated)
   ===================================================================== */
function captureNewForm(){
  const ti=document.getElementById('f-title'), de=document.getElementById('f-desc');
  if(ti) state.newTask.title=ti.value;
  if(de) state.newTask.desc=de.value;
}

document.addEventListener('click', e=>{
  const el = e.target.closest('[data-action]');
  // overlay backdrop closes sheet
  if(!el){
    const ov=e.target.closest('[data-overlay]');
    if(ov && e.target===ov){ closeSheet(); }
    return;
  }
  const a = el.dataset.action;
  switch(a){
    case 'back': back(); break;
    case 'home': state.stack=[{view:'home'}]; state.sheet=null; render(); break;
    case 'open-project': navigate('project',{id:el.dataset.id}); break;
    case 'open-bereich': navigate(el.dataset.bereich==='triagen'?'triages':'tasks'); break;
    case 'open-task': navigate('task',{id:el.dataset.id}); break;
    case 'open-triage': toast('Triage-Detail folgt'); break;
    case 'new': captureNewForm(); navigate('new'); break;
    case 'filter': state.filter=el.dataset.filter; render(); break;
    case 'open-sheet': if(cur().view==='new') captureNewForm(); openSheet(el.dataset.sheet); break;
    case 'close-sheet': closeSheet(); break;
    case 'apply-filter': closeSheet(); toast('Filter angewendet'); break;
    case 'toggle-label': {
      const v=el.dataset.val;
      state.newLabels.has(v)?state.newLabels.delete(v):state.newLabels.add(v);
      captureNewForm(); render(); break;
    }
    case 'claim': {
      const t=findTask(el.dataset.id); if(t){ t.status='in_bearbeitung'; t.assignee='Du'; }
      render(); toast('Aufgabe übernommen'); break;
    }
    case 'set-status': {
      const t=findTask(cur().id)||TASKS.find(x=>x.id==='t0');
      const st=el.dataset.status;
      t.status=st;
      if(st==='offen') t.assignee=null;
      else if(!t.assignee||t.assignee===null) t.assignee='Du';
      closeSheet();
      toast('Status: '+STATUS[st].label);
      break;
    }
    case 'create-task': {
      captureNewForm();
      if(!state.newTask.title.trim() || !state.newTask.desc.trim()){ openSheet('validation'); }
      else {
        // add to list (front), reset form, go to tasks
        TASKS.unshift({id:'t'+Date.now(), title:state.newTask.title.trim(), author:'Du', when:'gerade eben', status:'offen', assignee:null});
        state.newTask={title:'',desc:''}; state.newLabels=new Set(['Entsorgung','Dringend']);
        state.stack=[{view:'home'},{view:'project',id:'nordring'},{view:'tasks'}];
        state.sheet=null; render(); toast('Aufgabe erstellt ✓');
      }
      break;
    }
    case 'toast': toast(el.dataset.msg); break;
  }
});

// keep form state on typing (so re-renders don't lose it)
document.addEventListener('input', e=>{
  if(e.target.id==='f-title') state.newTask.title=e.target.value;
  if(e.target.id==='f-desc') state.newTask.desc=e.target.value;
});

render();
</script>
</body>
</html>
